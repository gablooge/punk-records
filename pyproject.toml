[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "punk-records"
dynamic = ["version"]
description = "One brain for all your AI agents' memories (CLAUDE.md, AGENTS.md, napkins, rules), synced online or air-gapped."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "gablooge" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["ai", "memory", "claude", "agents", "mcp", "cursor", "codex", "sync", "air-gapped"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/gablooge/punk-records"
Issues = "https://github.com/gablooge/punk-records/issues"
Changelog = "https://github.com/gablooge/punk-records/blob/main/CHANGELOG.md"
Funding = "https://github.com/sponsors/gablooge"

[project.scripts]
punk = "punk_records.cli:main"
# Same command under the package name, so `uvx punk-records mcp` and `pipx run punk-records` work
# (how MCP clients start a server listed in the MCP Registry).
punk-records = "punk_records.cli:main"

[tool.setuptools.dynamic]
version = { attr = "punk_records.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade (3.9 syntax only)
select = ["F", "E", "W", "I", "B", "UP"]
