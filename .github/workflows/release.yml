name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Tag must match package version
        run: |
          v=$(PYTHONPATH=src python -c "import punk_records; print(punk_records.__version__)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }
      - run: python -m unittest discover -s tests
      - run: pipx run build
      - run: pipx run twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Waits for a maintainer to approve the deployment. The `pypi` environment must exist with a
    # required reviewer before the first tag; otherwise GitHub creates it unprotected.
    environment:
      name: pypi
      url: https://pypi.org/project/punk-records/
    permissions:
      id-token: write   # PyPI trusted publishing, no token stored
      contents: write   # create the GitHub release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes

  # Lists the new version in the MCP Registry (registry.modelcontextprotocol.io) as
  # io.github.gablooge/punk-records. Runs after PyPI, because the registry checks that the PyPI
  # README carries `mcp-name: io.github.gablooge/punk-records`. GitHub OIDC proves the repo owner;
  # no token is stored. mcp-publisher is pinned and its Sigstore signature checked before use.
  mcp-registry:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.11
    steps:
      - uses: actions/checkout@v7
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
          cosign verify-blob --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: server.json must match the tag
        run: |
          v="${GITHUB_REF_NAME#v}"
          python3 -c 'import json,sys; s=json.load(open("server.json")); v=sys.argv[1]; assert s["version"]==v and s["packages"][0]["version"]==v, (s["version"], v)' "$v"
      - run: ./mcp-publisher login github-oidc
      # PyPI can take a moment to serve the new release's description; retry before giving up.
      - name: Publish to the MCP Registry
        run: |
          for i in 1 2 3 4 5; do ./mcp-publisher publish && exit 0; echo "attempt $i failed; retrying in 30s"; sleep 30; done
          exit 1
