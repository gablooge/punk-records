name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff==0.17.5  # dev tool only, not a runtime dependency
      - run: ruff check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # age is optional for users; install it so the encryption tests run instead of skipping
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q age
      - if: runner.os == 'macOS'
        run: brew install age
      - if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install age.portable -y --no-progress
      - run: python -m unittest discover -s tests -v
